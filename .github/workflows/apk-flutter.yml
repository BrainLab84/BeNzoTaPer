name: Flutter-Test-APK bauen
on:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', '.github/workflows/apk-flutter.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # Test-APK: eigene ID (…buddy.test) und Name „BeNzoTaPer Test“ – läuft neben der alten App.
      - name: APK bauen (arm64, mit Testschlüssel signiert)
        run: flutter build apk --release --target-platform android-arm64
        env: { TB_TEST: '1' }
      - uses: actions/upload-artifact@v4
        with:
          name: tb-test-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
