name: Aufräumen (einmalig)
on: workflow_dispatch
permissions:
  actions: write
  contents: read
jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Drei alte Läufe löschen
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for id in 45198311957 45197924747 45197273156; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" && echo "gelöscht: $id"
          done
